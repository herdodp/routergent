<!DOCTYPE html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src https: http:;">
<title>RouterGent</title>
<style>
  :root { --bg:#111; --panel:#1a1a1a; --line:#2c2c2c; --text:#e8e8e8; --dim:#8a8a8a; --accent:#f08a3c; --ok:#4cc38a; --bad:#e5534b; --busy:#e0b341; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 1fr auto; height: 100%; }
  #side { grid-row: 1 / 3; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
  #side h1 { font-size: 15px; margin: 0; padding: 14px 14px 8px; color: var(--accent); }
  #addbar { display: flex; gap: 6px; padding: 0 12px 10px; }
  #addbar select, #addbar button, #composer button, #modeSel { background: #232323; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  #addbar select { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  #nodes { flex: 1; overflow: auto; padding: 0 8px 8px; }
  .node { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; background: #202020; cursor: pointer; }
  .node.sel { border-color: var(--accent); }
  .node .top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dim); flex: none; }
  .dot.ready { background: var(--ok); } .dot.busy { background: var(--busy); } .dot.down { background: var(--bad); }
  .node .name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node .meta { color: var(--dim); font-size: 11px; margin-top: 4px; }
  .node .acts { display: flex; gap: 6px; margin-top: 6px; }
  .node .acts button { background: #2a2a2a; color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px; font-size: 11px; }
  #mcp { border-top: 1px solid var(--line); padding: 10px 12px; color: var(--dim); font-size: 11px; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #stage webview { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #stage webview.hidden { visibility: hidden; pointer-events: none; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--dim); text-align: center; padding: 24px; }
  #bottom { border-top: 1px solid var(--line); background: var(--panel); }
  #chat { max-height: 260px; overflow: auto; padding: 10px 14px; display: none; border-bottom: 1px solid var(--line); }
  #chat .msg { margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; font-size: 12.5px; }
  #chat .who { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
  #chat .msg.user .who { color: var(--accent); }
  #chat .msg.assistant .who { color: var(--ok); }
  #chat .msg.tool-result { color: var(--dim); }
  #log { max-height: 140px; overflow: auto; padding: 8px 14px; font-size: 12px; color: var(--dim); display: none; }
  #log div { margin-bottom: 3px; } #log .err { color: var(--bad); } #log .fo { color: var(--busy); } #log .ok { color: var(--ok); }
  #composer { display: flex; gap: 8px; padding: 10px 14px; align-items: flex-end; }
  #prompt { flex: 1; resize: none; height: 56px; background: #232323; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  #prompt:focus { outline: none; border-color: var(--accent); }
  #send { background: var(--accent); color: #111; border: 0; font-weight: 700; padding: 10px 18px; }
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <h1>RouterGent</h1>
    <div id="addbar">
      <select id="provider"></select>
      <button id="addNode" title="Add a webview node">+ Node</button>
    </div>
    <div id="nodes"></div>
    <div id="mcp">MCP: starting…</div>
  </aside>

  <main id="stage">
    <div id="empty">Add a node, log in to your AI account in the webview, then press <b>&nbsp;Start agent&nbsp;</b>.</div>
  </main>

  <footer id="bottom">
    <div id="chat"></div>
    <div id="log"></div>
    <div id="composer">
      <select id="modeSel" title="Which node takes the prompt"><option value="auto">Auto (random)</option></select>
      <textarea id="prompt" placeholder="Type the parent prompt… (Enter to send, Shift+Enter for newline)"></textarea>
      <button id="send">Send</button>
    </div>
  </footer>
</div>
<script src="renderer.js"></script>
</body>
</html>
